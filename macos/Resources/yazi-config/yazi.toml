# macos/Resources/yazi-config/yazi.toml

[mgr]
ratio = [0, 1, 3]

[preview]
wrap = "yes"

[opener]
edit = [
    { run = 'poltertty-open "$@"', desc = "Open in Poltertty tab", for = "unix" },
]
open = [
    { run = 'open "$@"', desc = "Open with system default", for = "macos" },
]

[plugin]
prepend_previewers = [
    { mime = "text/*", run = "git-diff" },
]
